name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR's commits on pull_request events

jobs:
  server:
    name: server (build + unit + architecture + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build server/Messenger.sln -c Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test server/Messenger.sln -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/tests/**/TestResults/**

  client:
    name: client (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  ai:
    name: ai (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [server, client, ai]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t messenger:ci .

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
